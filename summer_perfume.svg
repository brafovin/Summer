<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="300" height="500">
  <defs>
    <!-- Goldgelber Flaschen-Gradient -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8860b;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fff176;stop-opacity:0.95" />
      <stop offset="80%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>

    <!-- Flüssigkeits-Gradient (Flasche gefüllt) -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.85" />
      <stop offset="40%" style="stop-color:#fde68a;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#fbbf24;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.85" />
    </linearGradient>

    <!-- Deckel-Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>

    <!-- Glanzlicht -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Schatten-Filter -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#b8860b" flood-opacity="0.5"/>
    </filter>

    <!-- Glas-Textur-Gradient für Flaschenkörper -->
    <radialGradient id="glassGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#fffde7;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#fbc02d;stop-opacity:0.3" />
    </radialGradient>

    <!-- Etikett-Gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffde7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff9c4;stop-opacity:1" />
    </linearGradient>

    <clipPath id="bottleClip">
      <path d="
        M115,140
        Q110,130 108,115
        L108,100
        Q108,88 120,88
        L180,88
        Q192,88 192,100
        L192,115
        Q190,130 185,140
        Q200,155 205,175
        L210,200
        L210,390
        Q210,420 150,420
        Q90,420 90,390
        L90,200
        L95,175
        Q100,155 115,140
        Z
      "/>
    </clipPath>
  </defs>

  <!-- Hintergrund (optional, für Vorschau) -->
  <rect width="300" height="500" fill="none"/>

  <!-- ===== FLASCHE ===== -->
  <g filter="url(#shadow)">

    <!-- Flaschenkörper Flüssigkeit -->
    <path d="
      M115,140
      Q110,130 108,115
      L108,100
      Q108,88 120,88
      L180,88
      Q192,88 192,100
      L192,115
      Q190,130 185,140
      Q200,155 205,175
      L210,200
      L210,390
      Q210,420 150,420
      Q90,420 90,390
      L90,200
      L95,175
      Q100,155 115,140
      Z
    " fill="url(#liquidGrad)" />

    <!-- Flaschenkörper Glas-Overlay -->
    <path d="
      M115,140
      Q110,130 108,115
      L108,100
      Q108,88 120,88
      L180,88
      Q192,88 192,100
      L192,115
      Q190,130 185,140
      Q200,155 205,175
      L210,200
      L210,390
      Q210,420 150,420
      Q90,420 90,390
      L90,200
      L95,175
      Q100,155 115,140
      Z
    " fill="url(#glassGrad)" />

    <!-- Flaschenkörper Kontur -->
    <path d="
      M115,140
      Q110,130 108,115
      L108,100
      Q108,88 120,88
      L180,88
      Q192,88 192,100
      L192,115
      Q190,130 185,140
      Q200,155 205,175
      L210,200
      L210,390
      Q210,420 150,420
      Q90,420 90,390
      L90,200
      L95,175
      Q100,155 115,140
      Z
    " fill="none" stroke="#b8860b" stroke-width="2" />

    <!-- Glanzlicht auf der Flasche -->
    <path d="
      M118,145
      Q114,133 112,118
      L112,103
      Q112,94 122,94
      L148,94
      L148,415
      Q120,413 100,395
      L100,200
      L105,178
      Q110,158 118,145
      Z
    " fill="url(#shineGrad)" opacity="0.5" />

    <!-- Reflexion rechts -->
    <path d="
      M185,150
      Q194,165 200,185
      L205,210
      L205,380
      Q198,410 180,418
      L175,418
      L175,94
      Q188,97 192,115
      L192,130
      Q189,140 185,150
      Z
    " fill="#ffffff" opacity="0.08" />

  </g>

  <!-- ===== ETIKETT ===== -->
  <g>
    <!-- Etiketten-Rahmen außen (Gold) -->
    <rect x="95" y="220" width="110" height="130" rx="8" ry="8"
          fill="#ffd700" stroke="#b8860b" stroke-width="1.5" />

    <!-- Etiketten-Fläche -->
    <rect x="99" y="224" width="102" height="122" rx="6" ry="6"
          fill="url(#labelGrad)" />

    <!-- Dekor-Linie oben -->
    <line x1="108" y1="236" x2="192" y2="236" stroke="#ffd700" stroke-width="1" opacity="0.8"/>
    <!-- Dekor-Linie unten -->
    <line x1="108" y1="332" x2="192" y2="332" stroke="#ffd700" stroke-width="1" opacity="0.8"/>

    <!-- Sonne-Symbol -->
    <g transform="translate(150, 258)">
      <!-- Sonnenstrahlen -->
      <line x1="0" y1="-16" x2="0" y2="-22" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="16" x2="0" y2="22" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="-16" y1="0" x2="-22" y2="0" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="22" y2="0" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="-11.3" y1="-11.3" x2="-15.6" y2="-15.6" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="11.3" y1="-11.3" x2="15.6" y2="-15.6" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="-11.3" y1="11.3" x2="-15.6" y2="15.6" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <line x1="11.3" y1="11.3" x2="15.6" y2="15.6" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
      <!-- Sonnen-Kreis -->
      <circle cx="0" cy="0" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="#fde68a"/>
    </g>

    <!-- Marken-Name "SUMMER" -->
    <text x="150" y="302"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="22"
          font-weight="bold"
          letter-spacing="4"
          text-anchor="middle"
          fill="#7c4f00">SUMMER</text>

    <!-- Untertitel -->
    <text x="150" y="318"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="9"
          letter-spacing="3"
          text-anchor="middle"
          fill="#b8860b">EAU DE PARFUM</text>

    <!-- Volumen -->
    <text x="150" y="340"
          font-family="Arial, sans-serif"
          font-size="8"
          letter-spacing="1"
          text-anchor="middle"
          fill="#a0855f">50 ml · 1.7 FL. OZ.</text>
  </g>

  <!-- ===== HALS ===== -->
  <rect x="126" y="55" width="48" height="38" rx="4" ry="4"
        fill="url(#bottleGrad)" stroke="#b8860b" stroke-width="1.5"/>
  <!-- Hals Glanzlicht -->
  <rect x="130" y="58" width="14" height="32" rx="3" ry="3"
        fill="url(#shineGrad)" opacity="0.4"/>

  <!-- ===== DECKEL ===== -->
  <g filter="url(#shadow)">
    <!-- Deckel-Körper -->
    <rect x="118" y="20" width="64" height="40" rx="6" ry="6"
          fill="url(#capGrad)" stroke="#b8860b" stroke-width="1.5"/>
    <!-- Deckel-Glanzlicht -->
    <rect x="124" y="24" width="18" height="32" rx="4" ry="4"
          fill="url(#shineGrad)" opacity="0.5"/>
    <!-- Deckel-Dekor-Linie -->
    <line x1="118" y1="45" x2="182" y2="45" stroke="#b8860b" stroke-width="1" opacity="0.5"/>
    <!-- Deckel-Top -->
    <rect x="130" y="12" width="40" height="14" rx="4" ry="4"
          fill="url(#capGrad)" stroke="#b8860b" stroke-width="1.5"/>
  </g>

  <!-- ===== BODEN REFLEXION ===== -->
  <ellipse cx="150" cy="425" rx="58" ry="10" fill="#ffd700" opacity="0.15"/>
  <ellipse cx="150" cy="430" rx="70" ry="8" fill="#ffd700" opacity="0.08"/>

</svg>
