<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Hauptkörper Gradient -->
    <radialGradient id="bodyGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   style="stop-color:#fff9c4;stop-opacity:1" />
      <stop offset="35%"  style="stop-color:#fde047;stop-opacity:1" />
      <stop offset="70%"  style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </radialGradient>

    <!-- Strahl Gradient -->
    <radialGradient id="rayGrad" cx="50%" cy="100%" r="100%">
      <stop offset="0%"   style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="60%"  style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.7" />
    </radialGradient>

    <!-- Hals Gradient -->
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#b45309" />
      <stop offset="30%"  style="stop-color:#fde047" />
      <stop offset="60%"  style="stop-color:#fff9c4" />
      <stop offset="100%" style="stop-color:#b45309" />
    </linearGradient>

    <!-- Deckel Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#fff9c4" />
      <stop offset="50%"  style="stop-color:#fbbf24" />
      <stop offset="100%" style="stop-color:#92400e" />
    </linearGradient>

    <!-- Glanzlicht -->
    <radialGradient id="shine" cx="30%" cy="28%" r="45%">
      <stop offset="0%"   style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="50%"  style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- Etikett Gradient -->
    <radialGradient id="labelGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%"   style="stop-color:#fffde7" />
      <stop offset="100%" style="stop-color:#fef08a" />
    </radialGradient>

    <!-- Schatten -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#92400e" flood-opacity="0.45"/>
    </filter>
    <filter id="rayShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#92400e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ======= SONNENSTRAHLEN (hinter Körper) ======= -->
  <!-- 8 Strahlen, gleichmäßig verteilt um Kreismitte (200, 270) -->
  <g filter="url(#rayShadow)">

    <!-- Strahl oben (wird von Hals verdeckt – trotzdem zeichnen für Symmetrie) -->
    <polygon points="200,130  188,182  212,182"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

    <!-- Strahl oben-rechts -->
    <polygon points="290,160  228,202  246,220"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

    <!-- Strahl rechts -->
    <polygon points="328,270  268,258  268,282"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

    <!-- Strahl unten-rechts -->
    <polygon points="290,380  244,320  226,338"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

    <!-- Strahl unten -->
    <polygon points="200,415  188,358  212,358"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

    <!-- Strahl unten-links -->
    <polygon points="110,380  156,338  174,320"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

    <!-- Strahl links -->
    <polygon points="72,270  132,282  132,258"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

    <!-- Strahl oben-links -->
    <polygon points="110,160  154,220  172,202"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.2"/>

  </g>

  <!-- ======= FLASCHENKÖRPER (Kreis = Sonnen-Mitte) ======= -->
  <circle cx="200" cy="270" r="95"
          fill="url(#bodyGrad)" stroke="#b45309" stroke-width="2.5"
          filter="url(#shadow)"/>

  <!-- Glasglanz auf dem Körper -->
  <circle cx="200" cy="270" r="95" fill="url(#shine)"/>

  <!-- ======= ETIKETT ======= -->
  <circle cx="200" cy="270" r="72" fill="url(#labelGrad)" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Dekor-Doppelring -->
  <circle cx="200" cy="270" r="68" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
  <circle cx="200" cy="270" r="64" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.4"/>

  <!-- Kleines Sonnensymbol oben im Etikett -->
  <g transform="translate(200,238)">
    <circle cx="0" cy="0" r="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="6"  fill="#fde68a"/>
    <line x1="0" y1="-14" x2="0" y2="-18"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="14"  x2="0" y2="18"   stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="-18" y2="0"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14"  y1="0" x2="18"  y2="0"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-9.9" y1="-9.9" x2="-12.7" y2="-12.7" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9.9"  y1="-9.9" x2="12.7"  y2="-12.7" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-9.9" y1="9.9"  x2="-12.7" y2="12.7"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9.9"  y1="9.9"  x2="12.7"  y2="12.7"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Markenname -->
  <text x="200" y="278"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="bold"
        letter-spacing="5" text-anchor="middle"
        fill="#7c3a00">SUMMER</text>

  <!-- Untertitel -->
  <text x="200" y="297"
        font-family="Georgia, serif"
        font-size="9.5" letter-spacing="3.5"
        text-anchor="middle" fill="#b45309">EAU DE PARFUM</text>

  <!-- Volumen -->
  <text x="200" y="316"
        font-family="Arial, sans-serif"
        font-size="8" letter-spacing="1.5"
        text-anchor="middle" fill="#92400e">50 ml · 1.7 FL.OZ.</text>

  <!-- ======= HALS ======= -->
  <rect x="182" y="152" width="36" height="28" rx="4"
        fill="url(#neckGrad)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Hals-Glanz -->
  <rect x="185" y="155" width="10" height="22" rx="3"
        fill="#ffffff" opacity="0.25"/>

  <!-- ======= DÜSE / SPRÜH-KOPF ======= -->
  <rect x="188" y="130" width="24" height="16" rx="3"
        fill="url(#neckGrad)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Sprüh-Öffnung -->
  <rect x="208" y="136" width="14" height="6" rx="2"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="1"/>

  <!-- ======= DECKEL ======= -->
  <rect x="176" y="96" width="48" height="40" rx="7"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="2"
        filter="url(#shadow)"/>
  <!-- Deckel-Glanz -->
  <rect x="181" y="101" width="14" height="30" rx="4"
        fill="#ffffff" opacity="0.3"/>
  <!-- Deckel-Dekor-Linie -->
  <line x1="176" y1="120" x2="224" y2="120" stroke="#b45309" stroke-width="0.8" opacity="0.5"/>
  <!-- Deckel-Knopf -->
  <rect x="188" y="84" width="24" height="16" rx="4"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="1.5"/>

  <!-- ======= BODEN-REFLEXION ======= -->
  <ellipse cx="200" cy="368" rx="75" ry="11" fill="#fbbf24" opacity="0.12"/>
  <ellipse cx="200" cy="374" rx="90" ry="7"  fill="#fbbf24" opacity="0.07"/>

</svg>
