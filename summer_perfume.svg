<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>

    <!-- Strahlen: Radialer Gradient vom Flaschenzentrum nach außen -->
    <radialGradient id="rayGrad" cx="200" cy="292" r="185" gradientUnits="userSpaceOnUse">
      <stop offset="50%"  stop-color="#fffde7" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Flaschenkörper -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#b45309"/>
      <stop offset="22%"  stop-color="#fbbf24"/>
      <stop offset="50%"  stop-color="#fef9c3"/>
      <stop offset="78%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glasglanz -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Hals -->
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#92400e"/>
      <stop offset="30%"  stop-color="#fde047"/>
      <stop offset="60%"  stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Deckel -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fef9c3"/>
      <stop offset="45%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Standfuß -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#78350f"/>
      <stop offset="30%"  stop-color="#d97706"/>
      <stop offset="60%"  stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Etikett -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Schatten Flasche -->
    <filter id="bottleShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#78350f" flood-opacity="0.4"/>
    </filter>

    <!-- Weicher Strahlen-Glow -->
    <filter id="rayGlow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ================================================================
       SONNENSTRAHLEN
       Alle rotiert um den Flaschenmittelpunkt (200, 292).
       Strahl-Grundform zeigt nach rechts:
         Langer Strahl:  "268,292 292,270 382,292 292,314"
         Kurzer Strahl:  "272,292 287,279 334,292 287,305"
       Drehrichtung in SVG ist im Uhrzeigersinn.
       Winkel von oben (12 Uhr), im UZS:
         0°   = oben    → SVG rotate(-90)
         30°  = oben-re → SVG rotate(-60)
         60°  = re-oben → SVG rotate(-30)
         90°  = rechts  → SVG rotate(0)
         270° = links   → SVG rotate(180)
         300° = li-oben → SVG rotate(210)
         330° = oben-li → SVG rotate(240)
       ================================================================ -->

  <g filter="url(#rayGlow)">

    <!-- ---- 7 LANGE STRAHLEN ---- -->
    <!-- Oben (0°) -->
    <polygon points="268,292 292,270 382,292 292,314"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.9"
             transform="rotate(-90,200,292)"/>
    <!-- Oben-rechts (30°) -->
    <polygon points="268,292 292,270 382,292 292,314"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.9"
             transform="rotate(-60,200,292)"/>
    <!-- Rechts-oben (60°) -->
    <polygon points="268,292 292,270 382,292 292,314"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.9"
             transform="rotate(-30,200,292)"/>
    <!-- Rechts (90°) -->
    <polygon points="268,292 292,270 382,292 292,314"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.9"
             transform="rotate(0,200,292)"/>
    <!-- Links (270°) -->
    <polygon points="268,292 292,270 382,292 292,314"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.9"
             transform="rotate(180,200,292)"/>
    <!-- Links-oben (300°) -->
    <polygon points="268,292 292,270 382,292 292,314"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.9"
             transform="rotate(210,200,292)"/>
    <!-- Oben-links (330°) -->
    <polygon points="268,292 292,270 382,292 292,314"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.9"
             transform="rotate(240,200,292)"/>

    <!-- ---- 8 KURZE STRAHLEN (zwischen den langen) ---- -->
    <!-- 15° -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(-75,200,292)"/>
    <!-- 45° -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(-45,200,292)"/>
    <!-- 75° -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(-15,200,292)"/>
    <!-- 105° (leicht nach unten-rechts) -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(15,200,292)"/>
    <!-- 255° (leicht nach unten-links) -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(165,200,292)"/>
    <!-- 285° -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(195,200,292)"/>
    <!-- 315° -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(225,200,292)"/>
    <!-- 345° -->
    <polygon points="272,292 287,279 334,292 287,305"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="0.6"
             transform="rotate(255,200,292)"/>

  </g>

  <!-- ================================================================
       FLASCHENKÖRPER
       ================================================================ -->
  <g filter="url(#bottleShadow)">

    <!-- Verbindung Körper → Standfuß -->
    <rect x="133" y="388" width="134" height="18" fill="url(#bodyGrad)" stroke="none"/>

    <!-- Standfuß -->
    <rect x="122" y="398" width="156" height="24" rx="6"
          fill="url(#baseGrad)" stroke="#78350f" stroke-width="2"/>
    <rect x="130" y="402" width="42" height="16" rx="3"
          fill="#ffffff" opacity="0.14"/>

    <!-- Hauptkörper: Ellipse -->
    <ellipse cx="200" cy="292" rx="90" ry="116"
             fill="url(#bodyGrad)" stroke="#b45309" stroke-width="2.2"/>

    <!-- Glasglanz-Overlay -->
    <ellipse cx="200" cy="292" rx="90" ry="116"
             fill="url(#shineGrad)" opacity="0.6"/>

    <!-- Seitliche Glasreflexion rechts -->
    <ellipse cx="268" cy="292" rx="14" ry="80"
             fill="#ffffff" opacity="0.06"/>

  </g>

  <!-- ================================================================
       ETIKETT
       ================================================================ -->
  <ellipse cx="200" cy="292" rx="66" ry="84"
           fill="url(#labelGrad)" stroke="#f59e0b" stroke-width="1.8"/>
  <!-- Innerer Zierring -->
  <ellipse cx="200" cy="292" rx="61" ry="79"
           fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.55"/>

  <!-- Kleines Sonnensymbol auf Etikett -->
  <g transform="translate(200,250)">
    <circle cx="0" cy="0" r="13"   fill="#fbbf24" stroke="#f59e0b" stroke-width="1.3"/>
    <circle cx="0" cy="0" r="8"    fill="#fef9c3"/>
    <line x1="0"    y1="-17" x2="0"    y2="-22" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0"    y1="17"  x2="0"    y2="22"  stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-17"  y1="0"   x2="-22"  y2="0"   stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="17"   y1="0"   x2="22"   y2="0"   stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-12"  y1="-12" x2="-15.6" y2="-15.6" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12"   y1="-12" x2="15.6"  y2="-15.6" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12"  y1="12"  x2="-15.6" y2="15.6"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12"   y1="12"  x2="15.6"  y2="15.6"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Markenname -->
  <text x="200" y="300"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="bold"
        letter-spacing="4" text-anchor="middle"
        fill="#7c3a00">SUMMER</text>

  <text x="200" y="320"
        font-family="Georgia, serif"
        font-size="9" letter-spacing="3.5"
        text-anchor="middle" fill="#b45309">EAU DE PARFUM</text>

  <text x="200" y="340"
        font-family="Arial, sans-serif"
        font-size="7.5" letter-spacing="1.5"
        text-anchor="middle" fill="#92400e">50 ml · 1.7 FL.OZ.</text>

  <!-- ================================================================
       HALS
       ================================================================ -->
  <rect x="183" y="150" width="34" height="36" rx="5"
        fill="url(#neckGrad)" stroke="#b45309" stroke-width="1.5"/>
  <rect x="187" y="154" width="10" height="28" rx="3"
        fill="#ffffff" opacity="0.22"/>

  <!-- ================================================================
       SPRÜHKOPF
       ================================================================ -->
  <rect x="189" y="126" width="22" height="28" rx="4"
        fill="url(#neckGrad)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Düse rechts -->
  <rect x="209" y="131" width="17" height="9" rx="3"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="1"/>

  <!-- ================================================================
       DECKEL
       ================================================================ -->
  <rect x="177" y="80" width="46" height="50" rx="8"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="2"
        filter="url(#bottleShadow)"/>
  <!-- Deckel-Glanz -->
  <rect x="183" y="86" width="13" height="38" rx="4"
        fill="#ffffff" opacity="0.28"/>
  <!-- Dekorlinie -->
  <line x1="177" y1="104" x2="223" y2="104"
        stroke="#b45309" stroke-width="0.8" opacity="0.45"/>
  <!-- Knopf oben -->
  <rect x="188" y="66" width="24" height="18" rx="5"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="1.5"/>

  <!-- ================================================================
       BODENSCHATTEN
       ================================================================ -->
  <ellipse cx="200" cy="430" rx="82" ry="8"  fill="#92400e" opacity="0.2"/>
  <ellipse cx="200" cy="436" rx="98" ry="5"  fill="#92400e" opacity="0.1"/>

</svg>
