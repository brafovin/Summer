<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Flaschenkörper Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#b45309" />
      <stop offset="20%"  style="stop-color:#fbbf24" />
      <stop offset="50%"  style="stop-color:#fef9c3" />
      <stop offset="80%"  style="stop-color:#fbbf24" />
      <stop offset="100%" style="stop-color:#b45309" />
    </linearGradient>

    <!-- Strahl Gradient -->
    <linearGradient id="rayGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#fde68a" />
      <stop offset="60%"  style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.6" />
    </linearGradient>

    <!-- Hals Gradient -->
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#92400e" />
      <stop offset="30%"  style="stop-color:#fde047" />
      <stop offset="60%"  style="stop-color:#fef9c3" />
      <stop offset="100%" style="stop-color:#92400e" />
    </linearGradient>

    <!-- Deckel Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#fef9c3" />
      <stop offset="50%"  style="stop-color:#fbbf24" />
      <stop offset="100%" style="stop-color:#78350f" />
    </linearGradient>

    <!-- Glanzlicht -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="25%"  style="stop-color:#ffffff;stop-opacity:0.55" />
      <stop offset="55%"  style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Etikett -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#fffde7" />
      <stop offset="100%" style="stop-color:#fef08a" />
    </linearGradient>

    <!-- Basis Gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#78350f" />
      <stop offset="30%"  style="stop-color:#d97706" />
      <stop offset="60%"  style="stop-color:#fde68a" />
      <stop offset="100%" style="stop-color:#78350f" />
    </linearGradient>

    <!-- Schatten -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#78350f" flood-opacity="0.4"/>
    </filter>
    <filter id="rayShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#92400e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ===== SONNENSTRAHLEN (nur oben & seitlich) ===== -->
  <!-- Mittelpunkt des runden Flaschenkörpers: cx=200, cy=290 -->

  <g filter="url(#rayShadow)">
    <!-- Strahl oben-links-weit -->
    <polygon points="200,290  148,188  164,210"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>
    <!-- Strahl oben-links -->
    <polygon points="200,290  118,220  136,236"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>
    <!-- Strahl links -->
    <polygon points="200,290  72,268   72,312"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>
    <!-- Strahl unten-links (flach, knapp über Basis) -->
    <polygon points="200,290  104,345  120,330"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>

    <!-- Strahl oben-rechts-weit -->
    <polygon points="200,290  252,188  236,210"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>
    <!-- Strahl oben-rechts -->
    <polygon points="200,290  282,220  264,236"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>
    <!-- Strahl rechts -->
    <polygon points="200,290  328,268  328,312"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>
    <!-- Strahl unten-rechts (flach, knapp über Basis) -->
    <polygon points="200,290  296,345  280,330"
             fill="url(#rayGrad)" stroke="#d97706" stroke-width="1"/>
  </g>

  <!-- ===== FLASCHENKÖRPER ===== -->
  <g filter="url(#shadow)">

    <!-- Basis / Standfuß -->
    <rect x="122" y="420" width="156" height="28" rx="6"
          fill="url(#baseGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Basis-Glanz -->
    <rect x="130" y="423" width="40" height="22" rx="4"
          fill="#ffffff" opacity="0.18"/>

    <!-- Hauptkörper (runde Flasche) -->
    <ellipse cx="200" cy="300" rx="92" ry="120"
             fill="url(#bodyGrad)" stroke="#b45309" stroke-width="2"/>

    <!-- Glas-Glanzlicht -->
    <ellipse cx="200" cy="300" rx="92" ry="120"
             fill="url(#shine)" opacity="0.6"/>

    <!-- Verbindung Körper → Basis -->
    <rect x="130" y="400" width="140" height="28" rx="0"
          fill="url(#bodyGrad)" stroke="none"/>
    <rect x="122" y="412" width="156" height="16" rx="4"
          fill="url(#baseGrad)" stroke="#b45309" stroke-width="1.5"/>

  </g>

  <!-- ===== ETIKETT ===== -->
  <ellipse cx="200" cy="300" rx="68" ry="88"
           fill="url(#labelGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <ellipse cx="200" cy="300" rx="63" ry="83"
           fill="none" stroke="#fbbf24" stroke-width="0.7" opacity="0.6"/>

  <!-- Kleines Sonnensymbol -->
  <g transform="translate(200,255)">
    <circle cx="0" cy="0" r="13" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="8"  fill="#fef9c3"/>
    <line x1="0"    y1="-18" x2="0"    y2="-23" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0"    y1="18"  x2="0"    y2="23"  stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-18"  y1="0"   x2="-23"  y2="0"   stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="18"   y1="0"   x2="23"   y2="0"   stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-12.7" y1="-12.7" x2="-16.3" y2="-16.3" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12.7"  y1="-12.7" x2="16.3"  y2="-16.3" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12.7" y1="12.7"  x2="-16.3" y2="16.3"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12.7"  y1="12.7"  x2="16.3"  y2="16.3"  stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Markenname -->
  <text x="200" y="307"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="bold"
        letter-spacing="4" text-anchor="middle"
        fill="#7c3a00">SUMMER</text>

  <!-- Untertitel -->
  <text x="200" y="328"
        font-family="Georgia, serif"
        font-size="9" letter-spacing="3.5"
        text-anchor="middle" fill="#b45309">EAU DE PARFUM</text>

  <!-- Volumen -->
  <text x="200" y="350"
        font-family="Arial, sans-serif"
        font-size="8" letter-spacing="1.5"
        text-anchor="middle" fill="#92400e">50 ml · 1.7 FL.OZ.</text>

  <!-- ===== HALS ===== -->
  <rect x="182" y="148" width="36" height="36" rx="5"
        fill="url(#neckGrad)" stroke="#b45309" stroke-width="1.5"/>
  <rect x="186" y="152" width="11" height="28" rx="3"
        fill="#ffffff" opacity="0.22"/>

  <!-- ===== SPRÜH-KOPF ===== -->
  <rect x="188" y="126" width="24" height="26" rx="4"
        fill="url(#neckGrad)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Düse -->
  <rect x="210" y="132" width="18" height="8" rx="3"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="1"/>

  <!-- ===== DECKEL ===== -->
  <rect x="175" y="82" width="50" height="50" rx="8"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="2"
        filter="url(#shadow)"/>
  <rect x="181" y="88" width="15" height="38" rx="4"
        fill="#ffffff" opacity="0.28"/>
  <line x1="175" y1="108" x2="225" y2="108"
        stroke="#b45309" stroke-width="0.8" opacity="0.5"/>
  <!-- Deckel-Knopf -->
  <rect x="187" y="68" width="26" height="18" rx="5"
        fill="url(#capGrad)" stroke="#b45309" stroke-width="1.5"/>

  <!-- ===== STANDFLÄCHE SCHATTEN ===== -->
  <ellipse cx="200" cy="455" rx="82" ry="9"  fill="#92400e" opacity="0.18"/>
  <ellipse cx="200" cy="460" rx="100" ry="6" fill="#92400e" opacity="0.09"/>

</svg>
