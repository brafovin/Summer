<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #c { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; width: 100%; padding: 12px 18px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .hud-box {
    background: rgba(0,0,0,0.45); border-radius: 10px; padding: 6px 14px;
    color: #fff; font-size: 13px; line-height: 1.6;
  }
  .hud-val { font-size: 22px; font-weight: 700; color: #f0c040; }
  .hearts { font-size: 20px; letter-spacing: 2px; }
  #ghost-tag {
    position: fixed; bottom: 18px; right: 18px;
    background: rgba(10,20,60,0.72); border: 1px solid #4466cc;
    border-radius: 10px; padding: 8px 14px; color: #aaddff;
    font-size: 13px; pointer-events: none; z-index: 10;
  }
  #ghost-tag .hearts { font-size: 18px; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(5,10,25,0.88); z-index: 20; color: #f8f4ee;
    text-align: center; gap: 6px;
  }
  #overlay h1 {
    font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 900; letter-spacing: .08em;
    background: linear-gradient(135deg, #f0c040, #fff3a0, #f0c040);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  #overlay p { font-size: 1.1rem; color: #ccd; }
  #overlay .score-display { font-size: 1.4rem; color: #f0c040; margin: 10px 0 24px; }
  #btn {
    padding: 14px 42px; font-size: 1.15rem; font-weight: 700; border: none;
    border-radius: 50px; cursor: pointer; letter-spacing: .06em;
    background: linear-gradient(135deg, #c9a820, #f0e050, #c9a820);
    color: #1a1000; box-shadow: 0 4px 24px #f0c04088;
    transition: transform .15s, box-shadow .15s;
  }
  #btn:hover { transform: scale(1.06); box-shadow: 0 6px 32px #f0e05099; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-box">
    <div>PUNKTE</div>
    <div class="hud-val" id="hud-score">0</div>
    <div style="margin-top:4px">REKORD</div>
    <div class="hud-val" id="hud-best">0</div>
  </div>
  <div class="hud-box" style="text-align:center">
    <div>SPEED</div>
    <div class="hud-val" id="hud-speed">0 km/h</div>
  </div>
  <div class="hud-box" style="text-align:right">
    <div>LEBEN</div>
    <div class="hearts" id="hud-lives">&#10084;&#65039;&#10084;&#65039;&#10084;&#65039;</div>
  </div>
</div>

<div id="ghost-tag">
  <div>GHOST KI</div>
  <div class="hearts" id="ghost-lives">&#10084;&#65039;&#10084;&#65039;&#10084;&#65039;</div>
</div>

<div id="overlay">
  <h1 id="overlay-title">SUMMER RACER</h1>
  <p>Weiche Hindernissen aus &mdash; überlebe so lange wie möglich!</p>
  <p style="font-size:.95rem;color:#99a">&#8592; &#8594; oder A D zum Spurwechsel</p>
  <div class="score-display" id="overlay-score"></div>
  <button id="btn">STARTEN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ── Constants ──────────────────────────────────────────────
  var LANES        = [-4.3, 0, 4.3];
  var ROAD_W       = 13;
  var SEG_Z        = 24;
  var N_SEGS       = 14;
  var N_TREES      = 20;
  var TREE_SPACING = 8;
  var ENEMY_POOL   = 12;
  var INV_FRAMES   = 140;

  // ── Renderer ───────────────────────────────────────────────
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  function resize(){
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ── Scene ──────────────────────────────────────────────────
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x7ab0d8, 0.014);
  scene.background = new THREE.Color(0x7ab0d8);

  // ── Camera ─────────────────────────────────────────────────
  var camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 350);
  resize();

  // ── Lights ─────────────────────────────────────────────────
  var sun = new THREE.DirectionalLight(0xfff0dd, 1.3);
  sun.position.set(15, 40, 10);
  scene.add(sun);

  var ambient = new THREE.AmbientLight(0xaac8e8, 0.7);
  scene.add(ambient);

  // ── Road Texture ───────────────────────────────────────────
  function makeRoadTexture(){
    var cv = document.createElement('canvas');
    cv.width = 256; cv.height = 256;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#555';
    ctx.fillRect(0, 0, 256, 256);
    // yellow edge lines
    ctx.fillStyle = '#e8c820';
    ctx.fillRect(0, 0, 14, 256);
    ctx.fillRect(242, 0, 14, 256);
    // white lane dashes
    ctx.fillStyle = '#eeeeee';
    for(var y = 0; y < 256; y += 40){
      ctx.fillRect(83, y, 8, 22);
      ctx.fillRect(165, y, 8, 22);
    }
    var tex = new THREE.CanvasTexture(cv);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 1);
    return tex;
  }
  var roadTex = makeRoadTexture();
  var roadMat  = new THREE.MeshPhongMaterial({ map: roadTex });
  var grassMat = new THREE.MeshPhongMaterial({ color: 0x3a8a2a });
  var roadGeo  = new THREE.PlaneGeometry(ROAD_W, SEG_Z);
  var grassGeo = new THREE.PlaneGeometry(30, SEG_Z);

  // ── Road Segments ──────────────────────────────────────────
  var segments = [];
  for(var i = 0; i < N_SEGS; i++){
    var road   = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI/2;
    var grassL = new THREE.Mesh(grassGeo, grassMat);
    grassL.rotation.x = -Math.PI/2;
    var grassR = new THREE.Mesh(grassGeo, grassMat);
    grassR.rotation.x = -Math.PI/2;

    var sz = -i * SEG_Z;
    road.position.set(0, 0, sz);
    grassL.position.set(-(ROAD_W/2 + 15), 0, sz);
    grassR.position.set( (ROAD_W/2 + 15), 0, sz);

    scene.add(road, grassL, grassR);
    segments.push({ road: road, grassL: grassL, grassR: grassR });
  }

  // ── Trees ──────────────────────────────────────────────────
  var trunkGeo   = new THREE.CylinderGeometry(0.18, 0.22, 1.6, 5);
  var foliageGeo = new THREE.ConeGeometry(1.1, 2.8, 6);
  var trunkMat   = new THREE.MeshPhongMaterial({ color: 0x6b4423 });
  var foliageMat = new THREE.MeshPhongMaterial({ color: 0x2a7a1a });

  var TREE_COLS = [
    -(ROAD_W/2 + 3.5), -(ROAD_W/2 + 8), -(ROAD_W/2 + 13),
     (ROAD_W/2 + 3.5),  (ROAD_W/2 + 8),  (ROAD_W/2 + 13)
  ];

  var treeMeshes = [];
  for(var col = 0; col < TREE_COLS.length; col++){
    var colTrees = [];
    for(var t = 0; t < N_TREES; t++){
      var trunk   = new THREE.Mesh(trunkGeo, trunkMat);
      var foliage = new THREE.Mesh(foliageGeo, foliageMat);
      foliage.position.y = 2.2;
      var grp = new THREE.Group();
      grp.add(trunk, foliage);
      grp.position.set(TREE_COLS[col], 0.8, -t * TREE_SPACING);
      scene.add(grp);
      colTrees.push(grp);
    }
    treeMeshes.push(colTrees);
  }

  // ── Car builder ────────────────────────────────────────────
  function buildCar(bodyColor, opts){
    opts = opts || {};
    var grp = new THREE.Group();
    var mat = new THREE.MeshPhongMaterial({
      color:            bodyColor,
      transparent:      opts.transparent   || false,
      opacity:          opts.opacity       !== undefined ? opts.opacity : 1,
      depthWrite:       opts.depthWrite    !== undefined ? opts.depthWrite : true,
      emissive:         opts.emissive      !== undefined ? new THREE.Color(opts.emissive) : new THREE.Color(0x000000),
      emissiveIntensity:opts.emissiveIntensity || 0
    });

    var body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.55, 4.2), mat);
    body.position.y = 0.55;
    grp.add(body);

    var cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.2), mat);
    cabin.position.set(0, 1.08, -0.2);
    grp.add(cabin);

    var wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.28, 10);
    var wheelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
    var wpos = [
      [-1.15, 0.38,  1.35],
      [ 1.15, 0.38,  1.35],
      [-1.15, 0.38, -1.35],
      [ 1.15, 0.38, -1.35]
    ];
    for(var wi = 0; wi < wpos.length; wi++){
      var w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI/2;
      w.position.set(wpos[wi][0], wpos[wi][1], wpos[wi][2]);
      grp.add(w);
    }
    return grp;
  }

  // ── Player Car ─────────────────────────────────────────────
  var player = buildCar(0xf0c040);
  player.position.set(0, 0, 6);
  scene.add(player);

  // ── Ghost AI Car ───────────────────────────────────────────
  var ghost = buildCar(0x2244cc, {
    transparent: true,
    opacity: 0.42,
    depthWrite: false,
    emissive: 0x1133aa,
    emissiveIntensity: 0.35
  });
  ghost.position.set(0, 0, 2);
  scene.add(ghost);

  // ── Enemy Pool ─────────────────────────────────────────────
  var ENEMY_COLORS = [0xe03030, 0x30b030, 0x9030c0, 0xd08020, 0x20a0c0, 0xcc2288];
  var enemies = [];
  for(var ei = 0; ei < ENEMY_POOL; ei++){
    var ecol = ENEMY_COLORS[ei % ENEMY_COLORS.length];
    var emesh = buildCar(ecol);
    emesh.visible = false;
    emesh.userData.active = false;
    scene.add(emesh);
    enemies.push(emesh);
  }

  function spawnEnemy(){
    for(var si = 0; si < enemies.length; si++){
      var e = enemies[si];
      if(!e.userData.active){
        var lane = LANES[Math.floor(Math.random() * LANES.length)];
        e.position.set(lane, 0, -90);
        e.userData.active = true;
        e.visible = true;
        return;
      }
    }
  }

  // ── Game State ─────────────────────────────────────────────
  var gameRunning  = false;
  var frame        = 0;
  var score        = 0;
  var speed        = 0.18;
  var playerLane   = 1;
  var playerTargetX = LANES[1];
  var playerLives  = 3;
  var ghostLane    = 1;
  var ghostTargetX = LANES[1];
  var ghostLives   = 3;
  var invFrames    = 0;
  var ghostInvFrames = 0;
  var died         = false;

  var keys     = {};
  var prevKeys = {};

  var bestScore = parseInt(localStorage.getItem('summerRacerBest') || '0');
  document.getElementById('hud-best').textContent = bestScore;

  // ── HUD ────────────────────────────────────────────────────
  function heartsHTML(n){
    var h = '';
    for(var i=0;i<Math.max(0,n);i++)       h += '&#10084;&#65039;';
    for(var i=0;i<Math.max(0,3-n);i++)     h += '&#128420;';
    return h;
  }

  function updateHUD(){
    document.getElementById('hud-score').textContent  = score;
    document.getElementById('hud-best').textContent   = bestScore;
    document.getElementById('hud-speed').textContent  = Math.round(speed * 780) + ' km/h';
    document.getElementById('hud-lives').innerHTML    = heartsHTML(playerLives);
    document.getElementById('ghost-lives').innerHTML  = heartsHTML(ghostLives);
  }

  // ── Start / End ────────────────────────────────────────────
  function startGame(){
    frame = 0; score = 0; speed = 0.18;
    playerLane = 1; playerTargetX = LANES[1];
    ghostLane  = 1; ghostTargetX  = LANES[1];
    playerLives = 3; ghostLives = 3;
    invFrames = 0; ghostInvFrames = 0; died = false;

    player.position.set(LANES[1], 0, 6);
    player.visible = true;
    ghost.position.set(LANES[1], 0, 2);
    ghost.visible = true;

    for(var i=0;i<enemies.length;i++){
      enemies[i].userData.active = false;
      enemies[i].visible = false;
    }

    for(var i=0;i<N_SEGS;i++){
      var sz = -i * SEG_Z;
      segments[i].road.position.z   = sz;
      segments[i].grassL.position.z = sz;
      segments[i].grassR.position.z = sz;
    }
    for(var col=0;col<treeMeshes.length;col++){
      for(var t=0;t<N_TREES;t++){
        treeMeshes[col][t].position.z = -t * TREE_SPACING;
      }
    }
    roadTex.offset.y = 0;

    document.getElementById('overlay').style.display = 'none';
    gameRunning = true;
    updateHUD();
  }

  function endGame(){
    gameRunning = false;
    if(score > bestScore){
      bestScore = score;
      localStorage.setItem('summerRacerBest', bestScore);
    }
    var ov = document.getElementById('overlay');
    document.getElementById('overlay-title').textContent = 'GAME OVER';
    document.getElementById('overlay-score').textContent =
      'Punkte: ' + score + '  |  Rekord: ' + bestScore;
    document.getElementById('btn').textContent = 'NOCHMAL';
    ov.style.display = 'flex';
    updateHUD();
  }

  document.getElementById('btn').addEventListener('click', startGame);

  // ── Keyboard ───────────────────────────────────────────────
  window.addEventListener('keydown', function(e){ keys[e.code] = true; });
  window.addEventListener('keyup',   function(e){ keys[e.code] = false; });

  // ── Touch swipe ────────────────────────────────────────────
  var touchStartX = 0;
  window.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  window.addEventListener('touchend', function(e){
    if(!gameRunning) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 30){
      if(dx < 0 && playerLane > 0){ playerLane--; playerTargetX = LANES[playerLane]; }
      else if(dx > 0 && playerLane < 2){ playerLane++; playerTargetX = LANES[playerLane]; }
    }
  }, { passive: true });

  // ── Ghost AI ───────────────────────────────────────────────
  function ghostAI(){
    if(frame % 30 !== 0) return;
    var laneCounts = [0, 0, 0];
    for(var gi=0;gi<enemies.length;gi++){
      var e = enemies[gi];
      if(!e.userData.active) continue;
      if(e.position.z > ghost.position.z - 20 && e.position.z < ghost.position.z + 10){
        for(var li=0;li<3;li++){
          if(Math.abs(e.position.x - LANES[li]) < 2){ laneCounts[li]++; break; }
        }
      }
    }
    var best = ghostLane, bestCount = 999;
    for(var li=0;li<3;li++){
      if(laneCounts[li] < bestCount){ bestCount = laneCounts[li]; best = li; }
    }
    ghostLane    = best;
    ghostTargetX = LANES[ghostLane];
  }

  // ── Main Loop ──────────────────────────────────────────────
  function animate(){
    requestAnimationFrame(animate);
    if(!gameRunning){ renderer.render(scene, camera); return; }

    frame++;
    score = frame;
    speed = 0.18 + frame * 0.000055;

    // Player input (edge detect)
    var leftNow  = keys['ArrowLeft']  || keys['KeyA'];
    var rightNow = keys['ArrowRight'] || keys['KeyD'];
    var leftPrev = prevKeys['ArrowLeft']  || prevKeys['KeyA'];
    var rightPrev= prevKeys['ArrowRight'] || prevKeys['KeyD'];

    if(leftNow  && !leftPrev  && playerLane > 0){ playerLane--; playerTargetX = LANES[playerLane]; }
    if(rightNow && !rightPrev && playerLane < 2){ playerLane++; playerTargetX = LANES[playerLane]; }

    prevKeys['ArrowLeft']  = keys['ArrowLeft'];
    prevKeys['ArrowRight'] = keys['ArrowRight'];
    prevKeys['KeyA']       = keys['KeyA'];
    prevKeys['KeyD']       = keys['KeyD'];

    player.position.x += (playerTargetX - player.position.x) * 0.14;

    // Ghost
    ghostAI();
    ghost.position.x += (ghostTargetX - ghost.position.x) * 0.09;

    // Scroll road segments
    for(var si=0;si<segments.length;si++){
      var seg = segments[si];
      seg.road.position.z   += speed;
      seg.grassL.position.z += speed;
      seg.grassR.position.z += speed;
      if(seg.road.position.z > SEG_Z * 1.5){
        var shift = N_SEGS * SEG_Z;
        seg.road.position.z   -= shift;
        seg.grassL.position.z -= shift;
        seg.grassR.position.z -= shift;
      }
    }

    // Scroll trees
    for(var col=0;col<treeMeshes.length;col++){
      for(var t=0;t<treeMeshes[col].length;t++){
        treeMeshes[col][t].position.z += speed;
        if(treeMeshes[col][t].position.z > 20){
          treeMeshes[col][t].position.z -= N_TREES * TREE_SPACING;
        }
      }
    }

    // Road texture scroll
    roadTex.offset.y -= speed / SEG_Z;

    // Spawn enemies
    var spawnInterval = Math.max(18, 60 - Math.floor(frame / 300));
    if(frame % spawnInterval === 0) spawnEnemy();

    // Move enemies + collision
    died = false;
    for(var ei=0;ei<enemies.length;ei++){
      var e = enemies[ei];
      if(!e.userData.active) continue;
      e.position.z += speed * 1.05;
      if(e.position.z > 20){
        e.userData.active = false;
        e.visible = false;
        continue;
      }
      // Player collision
      if(invFrames === 0){
        var pdx = Math.abs(player.position.x - e.position.x);
        var pdz = Math.abs(player.position.z - e.position.z);
        if(pdx < 1.75 && pdz < 2.6){
          playerLives--;
          invFrames = INV_FRAMES;
          if(playerLives <= 0){ died = true; }
        }
      }
      // Ghost collision
      if(ghostInvFrames === 0){
        var gdx = Math.abs(ghost.position.x - e.position.x);
        var gdz = Math.abs(ghost.position.z - e.position.z);
        if(gdx < 1.75 && gdz < 2.6){
          ghostLives--;
          ghostInvFrames = INV_FRAMES;
        }
      }
    }

    if(died){ endGame(); return; }

    // Invincibility flash
    if(invFrames > 0){
      invFrames--;
      player.visible = (Math.floor(invFrames / 8) % 2 === 0);
    } else {
      player.visible = true;
    }
    if(ghostInvFrames > 0) ghostInvFrames--;

    // Camera
    camera.position.set(player.position.x * 0.28, 5, 10);
    camera.lookAt(player.position.x * 0.28, 0.5, -5);

    updateHUD();
    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
