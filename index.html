<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Drift</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { display: block; }
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,4,18,0.90);
      font-family: 'Courier New', monospace;
      color: #fff;
      gap: 6px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: clamp(1.8rem, 7vw, 3.2rem);
      background: linear-gradient(135deg, #00ffb3 0%, #00c3ff 40%, #b300ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 6px;
      margin-bottom: 8px;
    }
    #overlay p { color: #7ac8ff; font-size: 0.85rem; }
    #overlay .hint { color: #9cf; font-size: 0.78rem; margin-top: 6px; }
    #scoreMsg { font-size: 1.25rem; color: #0ff; margin: 16px 0 4px; min-height: 1.6rem; }
    #startBtn {
      margin-top: 14px; padding: 13px 46px;
      font-size: 1rem; font-family: inherit; font-weight: bold; letter-spacing: 3px;
      background: linear-gradient(135deg, #00ffb3, #0055ff);
      color: #000; border: none; border-radius: 40px; cursor: pointer;
      box-shadow: 0 0 26px #00ffb355;
      transition: transform .12s, box-shadow .12s;
    }
    #startBtn:hover { transform: scale(1.08); box-shadow: 0 0 50px #00ffb388; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay">
  <h1>AURORA DRIFT</h1>
  <p>Steuere dein Lichtband durch den Kosmos</p>
  <p>Sammle Sternenstaub &nbsp;·&nbsp; Meide deinen Schweif</p>
  <p class="hint">WASD / Pfeiltasten &nbsp;·&nbsp; Swipe auf Mobile</p>
  <div id="scoreMsg"></div>
  <button id="startBtn">STARTEN</button>
</div>
<script>
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('scoreMsg');
const startBtn = document.getElementById('startBtn');

let W, H, bgCanvas;

function resize() {
  W = canvas.width  = Math.min(window.innerWidth,  820);
  H = canvas.height = Math.min(window.innerHeight, 700);
}
resize();
window.addEventListener('resize', resize);

// ── constants ──────────────────────────────────────────────────────────
const SPEED0    = 2.9;
const SPEED_INC = 0.10;   // per 10 orbs collected
const TURN_EASE = 0.17;
const HEAD_R    = 7;
const TAIL_WMAX = 15;
const INIT_LEN  = 40;
const GROW_RATE = 14;     // segments added per orb
const N_ORBS    = 3;
const POWER_DUR = 230;    // frames

// aurora hue cycle
const HUES = [160, 195, 240, 285, 320, 40, 80, 160];

// ── state ──────────────────────────────────────────────────────────────
let snake, dir, tDir, orbs, sparks;
let score, frame, running = false, powerT, colorPhase;
let best = +localStorage.getItem('aurorabest') || 0;

// ── nebula background (offscreen, rebuilt on resize) ───────────────────
function buildBg() {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const oc = off.getContext('2d');

  oc.fillStyle = '#00000d';
  oc.fillRect(0, 0, W, H);

  // soft nebula clouds
  [
    [W * 0.15, H * 0.25, W * 0.45, '#001a40'],
    [W * 0.82, H * 0.65, W * 0.38, '#0a0028'],
    [W * 0.50, H * 0.90, W * 0.50, '#001816'],
    [W * 0.70, H * 0.15, W * 0.30, '#160028'],
  ].forEach(([x, y, r, c]) => {
    const g = oc.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c);
    g.addColorStop(1, c + '00');
    oc.fillStyle = g;
    oc.fillRect(0, 0, W, H);
  });

  // stars
  for (let i = 0; i < 240; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = Math.random() < 0.06 ? 1.9 : Math.random() * 1.1 + 0.2;
    const a = 0.2 + Math.random() * 0.8;
    oc.fillStyle = `rgba(255,255,255,${a})`;
    oc.beginPath();
    oc.arc(x, y, r, 0, Math.PI * 2);
    oc.fill();
  }
  return off;
}

// ── init ───────────────────────────────────────────────────────────────
function init() {
  score = 0; frame = 0; powerT = 0; colorPhase = 0;
  const cx = W / 2, cy = H / 2;
  snake = [];
  for (let i = 0; i < INIT_LEN; i++) snake.push({ x: cx - i * 4, y: cy });
  dir  = { x: 1, y: 0 };
  tDir = { x: 1, y: 0 };
  sparks = [];
  orbs   = [];
  for (let i = 0; i < N_ORBS; i++) spawnOrb();
  bgCanvas = buildBg();
}

function spawnOrb() {
  const m = 55, pw = Math.random() < 0.18;
  orbs.push({
    x: m + Math.random() * (W - m * 2),
    y: m + Math.random() * (H - m * 2),
    pulse: Math.random() * Math.PI * 2,
    hue: HUES[Math.floor(Math.random() * HUES.length)],
    pw,
    r: pw ? 12 : 8,
  });
}

function burst(x, y, hue, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 1.2 + Math.random() * 5.5;
    sparks.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v,
                  life: 1, hue, r: 1.5 + Math.random() * 3.5 });
  }
}

// ── aurora color per segment ───────────────────────────────────────────
function segHue(i) {
  const t = i / Math.max(snake.length - 1, 1);
  // hue sweeps 180° along body + drifts over time
  return (colorPhase * 55 + t * 180) % 360;
}

// ── input ──────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowLeft',  'a', 'A'].includes(e.key)) tDir = { x:-1, y: 0 };
  if (['ArrowRight', 'd', 'D'].includes(e.key)) tDir = { x: 1, y: 0 };
  if (['ArrowUp',    'w', 'W'].includes(e.key)) tDir = { x: 0, y:-1 };
  if (['ArrowDown',  's', 'S'].includes(e.key)) tDir = { x: 0, y: 1 };
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { delete keys[e.key]; });

// touch swipe
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12)
    tDir = { x: Math.sign(dx), y: 0 };
  else if (Math.abs(dy) > 12)
    tDir = { x: 0, y: Math.sign(dy) };
  e.preventDefault();
}, { passive: false });

// ── update ─────────────────────────────────────────────────────────────
function update() {
  frame++;
  colorPhase += 0.0065;
  if (powerT > 0) powerT--;

  const speed = SPEED0 + Math.floor(score / 10) * SPEED_INC;

  // smooth steering
  dir.x += (tDir.x - dir.x) * TURN_EASE;
  dir.y += (tDir.y - dir.y) * TURN_EASE;
  const mag = Math.hypot(dir.x, dir.y) || 1;
  dir.x /= mag;
  dir.y /= mag;

  const head = snake[0];
  const nx = head.x + dir.x * speed;
  const ny = head.y + dir.y * speed;

  // wall collision
  if (nx < 4 || nx > W - 4 || ny < 4 || ny > H - 4) return die();

  snake.unshift({ x: nx, y: ny });
  const maxLen = INIT_LEN + score * GROW_RATE;
  while (snake.length > maxLen) snake.pop();

  // self-collision (skip first ~22 segments so turns feel fair)
  if (!powerT) {
    for (let i = 22; i < snake.length; i++) {
      if (Math.hypot(nx - snake[i].x, ny - snake[i].y) < HEAD_R * 1.35) return die();
    }
  }

  // orb collection
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.pulse += 0.07;
    if (Math.hypot(nx - o.x, ny - o.y) < o.r + HEAD_R + 6) {
      burst(o.x, o.y, o.hue, o.pw ? 60 : 30);
      if (o.pw) powerT = POWER_DUR;
      else score++;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }

  // particles
  sparks.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.94; s.vy *= 0.94;
    s.life -= 0.022;
  });
  sparks = sparks.filter(s => s.life > 0);
}

// ── draw ───────────────────────────────────────────────────────────────
function draw() {
  ctx.drawImage(bgCanvas, 0, 0);

  // arena border
  const bPow = powerT > 0;
  const ba   = bPow ? 0.5 + 0.35 * Math.sin(frame * 0.15) : 0.18;
  ctx.strokeStyle = bPow ? `rgba(210,0,255,${ba})` : `rgba(0,200,255,${ba})`;
  ctx.lineWidth = 3;
  ctx.strokeRect(2, 2, W - 4, H - 4);

  // ── snake ribbon ────────────────────────────────────────────────────
  if (snake.length > 2) {
    // draw from tail to head so head sits on top
    for (let i = snake.length - 2; i >= 0; i--) {
      const t     = i / (snake.length - 1); // 0=tail, 1=head
      const alpha = 0.05 + t * 0.92;
      const width = 1.5 + t * (TAIL_WMAX - 1.5);
      const hue   = segHue(i);
      const col   = `hsl(${hue},100%,65%)`;

      ctx.globalAlpha = alpha;
      ctx.shadowBlur  = t * 22;
      ctx.shadowColor = col;
      ctx.strokeStyle = col;
      ctx.lineWidth   = width;
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(snake[i + 1].x, snake[i + 1].y);
      ctx.lineTo(snake[i].x,     snake[i].y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;

    // head pulse
    const hHue = segHue(0);
    const hCol  = `hsl(${hHue},100%,72%)`;
    ctx.shadowBlur  = 38;
    ctx.shadowColor = hCol;
    ctx.fillStyle   = hCol;
    ctx.beginPath();
    ctx.arc(snake[0].x, snake[0].y, HEAD_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // power shield ring
    if (powerT > 0) {
      const pa = (Math.sin(frame * 0.25) * 0.35 + 0.55) * Math.min(1, powerT / POWER_DUR);
      ctx.strokeStyle = `rgba(220,0,255,${pa})`;
      ctx.lineWidth   = 4;
      ctx.shadowBlur  = 28;
      ctx.shadowColor = '#cc00ff';
      ctx.beginPath();
      ctx.arc(snake[0].x, snake[0].y, HEAD_R * 2.8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // ── orbs ──────────────────────────────────────────────────────────
  orbs.forEach(o => {
    const p   = Math.sin(o.pulse) * 0.35 + 1;
    const r   = o.r * p;
    const col = `hsl(${o.hue},100%,65%)`;
    ctx.shadowBlur  = 26;
    ctx.shadowColor = col;

    if (o.pw) {
      // spinning star (power-up)
      ctx.strokeStyle = col;
      ctx.lineWidth   = 2.5;
      ctx.fillStyle   = col.replace('65%', '65%').replace('hsl', 'hsla').replace(')', ',0.2)');
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a  = (i * 4 * Math.PI / 5) - Math.PI / 2 + o.pulse * 0.45;
        const px = o.x + Math.cos(a) * r;
        const py = o.y + Math.sin(a) * r;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      // glowing orb
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 2.4);
      g.addColorStop(0,   col);
      g.addColorStop(0.45, col.replace('65%', '65%').replace('hsl', 'hsla').replace(')', ',0.5)'));
      g.addColorStop(1,    col.replace('hsl', 'hsla').replace(')', ',0)'));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r * 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  });

  // ── sparkles ──────────────────────────────────────────────────────
  sparks.forEach(s => {
    const col = `hsl(${s.hue},100%,70%)`;
    ctx.globalAlpha = s.life;
    ctx.shadowBlur  = 9;
    ctx.shadowColor = col;
    ctx.fillStyle   = col;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur  = 0;

  // ── HUD ───────────────────────────────────────────────────────────
  ctx.font = 'bold 15px "Courier New"';

  ctx.textAlign   = 'left';
  ctx.fillStyle   = '#00ffcc';
  ctx.shadowBlur  = 9;
  ctx.shadowColor = '#00ffcc';
  ctx.fillText(`⭐ ${score}`, 14, 28);
  ctx.fillStyle   = '#88aaff';
  ctx.shadowColor = '#88aaff';
  ctx.fillText(`🏆 ${best}`, 14, 50);

  if (powerT > 0) {
    ctx.textAlign   = 'center';
    ctx.fillStyle   = '#ee00ff';
    ctx.shadowColor = '#ee00ff';
    ctx.fillText(`⚡ ${Math.ceil(powerT / 60)}s`, W / 2, 28);
  }

  ctx.textAlign   = 'right';
  ctx.fillStyle   = '#00aaff';
  ctx.shadowColor = '#00aaff';
  const spd = Math.round((SPEED0 + Math.floor(score / 10) * SPEED_INC) * 28);
  ctx.fillText(`${spd} km/h`, W - 14, 28);
  ctx.shadowBlur = 0;
  ctx.textAlign  = 'left';
}

// ── game loop ──────────────────────────────────────────────────────────
let raf;
function loop() {
  if (!running) return;
  update();
  draw();
  raf = requestAnimationFrame(loop);
}

function die() {
  running = false;
  cancelAnimationFrame(raf);
  if (score > best) { best = score; localStorage.setItem('aurorabest', best); }

  const title = overlay.querySelector('h1');
  const sub   = overlay.querySelectorAll('p')[0];
  title.textContent = score >= 5 ? '✨ WUNDERSCHÖN' : 'GAME OVER';
  title.style.fontSize = '';
  sub.textContent = score >= 5
    ? 'Kosmische Reise beendet!'
    : 'Du hast deinen eigenen Schweif berührt!';
  scoreEl.innerHTML = `⭐ ${score} &nbsp;&nbsp; 🏆 ${best}`;
  startBtn.textContent = 'NOCHMAL FLIEGEN';
  overlay.classList.remove('hidden');
}

startBtn.addEventListener('click', () => {
  init();
  overlay.classList.add('hidden');
  running = true;
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
