<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="55%" r="65%">
      <stop offset="0%"   stop-color="#FFF6C0"/>
      <stop offset="55%"  stop-color="#FDE8E8"/>
      <stop offset="100%" stop-color="#E8B4B8"/>
    </radialGradient>

    <!-- Bottle body gradient -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D98E8E"/>
      <stop offset="25%"  stop-color="#F4BFBF"/>
      <stop offset="55%"  stop-color="#FDE8E8"/>
      <stop offset="80%"  stop-color="#F4BFBF"/>
      <stop offset="100%" stop-color="#C87878"/>
    </linearGradient>

    <!-- Cap gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF5A0"/>
      <stop offset="50%"  stop-color="#F9E04B"/>
      <stop offset="100%" stop-color="#C8A800"/>
    </linearGradient>

    <!-- Label gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(255,220,220,0.70)"/>
    </linearGradient>

    <!-- Yellow stripe on label -->
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F9E04B"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#C87878" flood-opacity="0.30"/>
    </filter>

    <!-- Petal filter -->
    <filter id="petalShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#B06080" flood-opacity="0.25"/>
    </filter>

    <!-- Ice filter -->
    <filter id="iceShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A0D8EF" flood-opacity="0.5"/>
    </filter>

    <!-- Clip for bottle body -->
    <clipPath id="bottleClip">
      <rect x="275" y="320" width="250" height="430" rx="28"/>
    </clipPath>
  </defs>

  <!-- ══ Background ══ -->
  <rect width="800" height="900" fill="url(#bgGrad)"/>

  <!-- Soft background circle -->
  <circle cx="400" cy="480" r="310" fill="rgba(255,200,200,0.15)"/>
  <circle cx="400" cy="480" r="220" fill="rgba(255,240,150,0.10)"/>

  <!-- ══ Scattered petals – behind bottle ══ -->
  <!-- Large rose, bottom-left -->
  <g filter="url(#petalShadow)" opacity="0.85">
    <ellipse cx="145" cy="720" rx="60" ry="38" fill="#F4BFBF" transform="rotate(-30,145,720)"/>
    <ellipse cx="175" cy="695" rx="55" ry="35" fill="#F9D0D0" transform="rotate(-10,175,695)"/>
    <ellipse cx="185" cy="740" rx="50" ry="32" fill="#EAA0A0" transform="rotate(20,185,740)"/>
    <ellipse cx="148" cy="760" rx="45" ry="30" fill="#F4BFBF" transform="rotate(50,148,760)"/>
    <ellipse cx="115" cy="745" rx="42" ry="28" fill="#F9D0D0" transform="rotate(75,115,745)"/>
    <circle  cx="160" cy="730" r="22" fill="#E89898"/>
  </g>

  <!-- Peony top-right -->
  <g filter="url(#petalShadow)" opacity="0.80">
    <ellipse cx="648" cy="178" rx="52" ry="34" fill="#FFF0A0" transform="rotate(15,648,178)"/>
    <ellipse cx="678" cy="160" rx="48" ry="30" fill="#F9E04B" transform="rotate(40,678,160)"/>
    <ellipse cx="680" cy="198" rx="46" ry="28" fill="#FFD700" transform="rotate(-15,680,198)"/>
    <ellipse cx="645" cy="205" rx="44" ry="27" fill="#FFF0A0" transform="rotate(-40,645,205)"/>
    <ellipse cx="618" cy="188" rx="42" ry="26" fill="#F9E04B" transform="rotate(65,618,188)"/>
    <circle  cx="652" cy="187" r="18" fill="#E8C000"/>
  </g>

  <!-- Small pink flower top-left -->
  <g opacity="0.70">
    <ellipse cx="108" cy="220" rx="28" ry="17" fill="#F4BFBF" transform="rotate(-20,108,220)"/>
    <ellipse cx="130" cy="208" rx="26" ry="15" fill="#FDE8E8" transform="rotate(15,130,208)"/>
    <ellipse cx="130" cy="232" rx="24" ry="14" fill="#D98E8E" transform="rotate(40,130,232)"/>
    <ellipse cx="108" cy="238" rx="22" ry="13" fill="#F4BFBF" transform="rotate(65,108,238)"/>
    <ellipse cx="88"  cy="226" rx="22" ry="13" fill="#FDE8E8" transform="rotate(85,88,226)"/>
    <circle  cx="112" cy="224" r="12" fill="#C07070"/>
  </g>

  <!-- Loose petals scattered -->
  <ellipse cx="220" cy="820" rx="22" ry="12" fill="#F4BFBF" transform="rotate(-45,220,820)" opacity="0.6"/>
  <ellipse cx="590" cy="810" rx="19" ry="10" fill="#F9E04B" transform="rotate(30,590,810)"  opacity="0.55"/>
  <ellipse cx="670" cy="620" rx="17" ry="9"  fill="#FDE8E8" transform="rotate(-60,670,620)" opacity="0.5"/>
  <ellipse cx="130" cy="520" rx="20" ry="11" fill="#F9E04B" transform="rotate(20,130,520)"  opacity="0.5"/>
  <ellipse cx="700" cy="370" rx="15" ry="8"  fill="#F4BFBF" transform="rotate(-30,700,370)" opacity="0.45"/>

  <!-- ══ Ice crystals ══ -->
  <!-- Crystal macro, bottom-right -->
  <g filter="url(#iceShadow)" opacity="0.75">
    <polygon points="660,700 680,680 700,700 680,720" fill="#C8EDFF" stroke="#A0D8EF" stroke-width="1.5"/>
    <polygon points="660,700 680,660 700,700 680,740" fill="#D8F4FF" stroke="#A0D8EF" stroke-width="1" opacity="0.7"/>
    <line x1="680" y1="660" x2="680" y2="740" stroke="#A0D8EF" stroke-width="1.5"/>
    <line x1="642" y1="700" x2="718" y2="700" stroke="#A0D8EF" stroke-width="1.5"/>
    <line x1="654" y1="672" x2="706" y2="728" stroke="#A0D8EF" stroke-width="1"/>
    <line x1="654" y1="728" x2="706" y2="672" stroke="#A0D8EF" stroke-width="1"/>
  </g>

  <!-- Snowflake top-left area -->
  <g opacity="0.55" transform="translate(78,350)">
    <line x1="0" y1="-28" x2="0" y2="28"   stroke="#A0D8EF" stroke-width="2.5"/>
    <line x1="-28" y1="0" x2="28" y2="0"   stroke="#A0D8EF" stroke-width="2.5"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#A0D8EF" stroke-width="2"/>
    <line x1="-20" y1="20" x2="20" y2="-20" stroke="#A0D8EF" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#C8EDFF"/>
    <!-- branch tips -->
    <circle cx="0"   cy="-28" r="3" fill="#A0D8EF"/>
    <circle cx="0"   cy="28"  r="3" fill="#A0D8EF"/>
    <circle cx="-28" cy="0"   r="3" fill="#A0D8EF"/>
    <circle cx="28"  cy="0"   r="3" fill="#A0D8EF"/>
  </g>

  <!-- Small ice fragment -->
  <polygon points="580,760 598,748 610,762 598,775" fill="#D8F4FF" stroke="#A0D8EF" stroke-width="1" opacity="0.65"/>

  <!-- ══ Small sparkle dots ══ -->
  <circle cx="220" cy="160" r="5" fill="#F9E04B" opacity="0.8"/>
  <circle cx="240" cy="148" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="208" cy="148" r="2.5" fill="#F9E04B" opacity="0.5"/>

  <circle cx="580" cy="680" r="4.5" fill="#F4BFBF" opacity="0.75"/>
  <circle cx="595" cy="668" r="2.5" fill="#D98E8E" opacity="0.55"/>

  <circle cx="700" cy="280" r="4" fill="#A0D8EF" opacity="0.7"/>
  <circle cx="715" cy="268" r="2.5" fill="#C8EDFF" opacity="0.55"/>

  <!-- ══ Bottle shadow on surface ══ -->
  <ellipse cx="400" cy="780" rx="115" ry="22" fill="rgba(180,80,80,0.18)"/>

  <!-- ══ Perfume Bottle ══ -->
  <g filter="url(#shadow)">

    <!-- Cap -->
    <rect x="333" y="118" width="134" height="60" rx="20" fill="url(#capGrad)" stroke="#C8A800" stroke-width="2"/>
    <!-- Cap shine -->
    <rect x="345" y="126" width="50" height="16" rx="8" fill="rgba(255,255,255,0.55)"/>
    <!-- Cap bottom ridge -->
    <rect x="328" y="168" width="144" height="10" rx="5" fill="#D4B000" opacity="0.7"/>

    <!-- Collar / pump housing -->
    <rect x="352" y="178" width="96" height="30" rx="8" fill="#D98E8E" stroke="#C07070" stroke-width="1.5"/>
    <rect x="362" y="182" width="36" height="10" rx="5" fill="rgba(255,255,255,0.35)"/>

    <!-- Neck -->
    <rect x="368" y="206" width="64" height="40" rx="8" fill="#F4BFBF" stroke="#D98E8E" stroke-width="1.5"/>
    <rect x="374" y="210" width="20" height="28" rx="4" fill="rgba(255,255,255,0.30)"/>

    <!-- Shoulder -->
    <path d="M295,258 Q290,242 368,240 L432,240 Q510,242 505,258 L518,320 H282 Z"
          fill="#FDE8E8" stroke="#D98E8E" stroke-width="1.5"/>
    <!-- Shoulder shine -->
    <path d="M298,260 Q294,248 360,246 L380,246 Q310,250 305,265 Z"
          fill="rgba(255,255,255,0.4)"/>

    <!-- Bottle body -->
    <rect x="275" y="320" width="250" height="430" rx="28" fill="url(#bottleGrad)" stroke="#C87878" stroke-width="2"/>

    <!-- Inner glass sheen (left) -->
    <rect x="280" y="325" width="22" height="415" rx="11" fill="rgba(255,255,255,0.28)"/>
    <!-- Inner glass sheen (right subtle) -->
    <rect x="478" y="340" width="10" height="390" rx="5" fill="rgba(255,255,255,0.12)"/>

    <!-- ── Front Label ── -->
    <rect x="294" y="338" width="212" height="290" rx="16" fill="url(#labelGrad)" stroke="rgba(220,150,150,0.4)" stroke-width="1"/>

    <!-- Yellow top stripe on label -->
    <rect x="294" y="338" width="212" height="38" rx="16" fill="url(#stripeGrad)"/>
    <rect x="294" y="358" width="212" height="18" fill="#F9E04B"/>

    <!-- Brand name on yellow -->
    <text x="400" y="373" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="bold" letter-spacing="5" fill="#5a3a00">BLÜTENFRISCH</text>

    <!-- Horizontal dividers -->
    <line x1="305" y1="382" x2="495" y2="382" stroke="#D98E8E" stroke-width="0.8" opacity="0.5"/>

    <!-- Product name -->
    <text x="400" y="408" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#8B3A3A">Frische</text>
    <text x="400" y="434" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="bold" letter-spacing="2" fill="#6B2A2A">BLÜTE</text>

    <!-- Sub line -->
    <text x="400" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" letter-spacing="3" fill="#B07070">EAU DE PARFUM</text>

    <!-- Decorative line -->
    <line x1="330" y1="462" x2="470" y2="462" stroke="#D4B000" stroke-width="1"/>
    <circle cx="400" cy="462" r="3" fill="#F9E04B" stroke="#D4B000" stroke-width="0.8"/>

    <!-- ── Floral Illustration on label ── -->
    <!-- Central bloom petals -->
    <g transform="translate(400,520)">
      <!-- Petals layer 1 -->
      <ellipse cx="0"   cy="-32" rx="14" ry="26" fill="#F9D0D0" opacity="0.9"/>
      <ellipse cx="30"  cy="-14" rx="14" ry="26" fill="#F9D0D0" opacity="0.9" transform="rotate(60,30,-14)"/>
      <ellipse cx="30"  cy="14"  rx="14" ry="26" fill="#F4BFBF" opacity="0.9" transform="rotate(120,30,14)"/>
      <ellipse cx="0"   cy="32"  rx="14" ry="26" fill="#EAA8A8" opacity="0.9"/>
      <ellipse cx="-30" cy="14"  rx="14" ry="26" fill="#F4BFBF" opacity="0.9" transform="rotate(-120,-30,14)"/>
      <ellipse cx="-30" cy="-14" rx="14" ry="26" fill="#F9D0D0" opacity="0.9" transform="rotate(-60,-30,-14)"/>
      <!-- Inner petals -->
      <ellipse cx="0"   cy="-20" rx="9"  ry="18" fill="#FFECEC" opacity="0.75"/>
      <ellipse cx="17"  cy="-10" rx="9"  ry="18" fill="#FFECEC" opacity="0.75" transform="rotate(60,17,-10)"/>
      <ellipse cx="17"  cy="10"  rx="9"  ry="18" fill="#FFDADA" opacity="0.75" transform="rotate(120,17,10)"/>
      <ellipse cx="0"   cy="20"  rx="9"  ry="18" fill="#FFDADA" opacity="0.75"/>
      <ellipse cx="-17" cy="10"  rx="9"  ry="18" fill="#FFDADA" opacity="0.75" transform="rotate(-120,-17,10)"/>
      <ellipse cx="-17" cy="-10" rx="9"  ry="18" fill="#FFECEC" opacity="0.75" transform="rotate(-60,-17,-10)"/>
      <!-- Centre -->
      <circle cx="0" cy="0" r="14" fill="#F9E04B"/>
      <circle cx="0" cy="0" r="9"  fill="#FFD700"/>
      <circle cx="0" cy="0" r="5"  fill="#C8A000"/>
      <!-- Stamens -->
      <circle cx="0"  cy="-9" r="2" fill="#8B6000" opacity="0.6"/>
      <circle cx="8"  cy="-4" r="2" fill="#8B6000" opacity="0.6"/>
      <circle cx="8"  cy="4"  r="2" fill="#8B6000" opacity="0.6"/>
      <circle cx="0"  cy="9"  r="2" fill="#8B6000" opacity="0.6"/>
      <circle cx="-8" cy="4"  r="2" fill="#8B6000" opacity="0.6"/>
      <circle cx="-8" cy="-4" r="2" fill="#8B6000" opacity="0.6"/>
    </g>

    <!-- Small flanking blossoms -->
    <g transform="translate(325,555)" opacity="0.75">
      <ellipse cx="0"   cy="-14" rx="7" ry="12" fill="#F9E04B"/>
      <ellipse cx="12"  cy="-7"  rx="7" ry="12" fill="#FFD700" transform="rotate(60,12,-7)"/>
      <ellipse cx="12"  cy="7"   rx="7" ry="12" fill="#F9E04B" transform="rotate(120,12,7)"/>
      <ellipse cx="0"   cy="14"  rx="7" ry="12" fill="#FFD700"/>
      <ellipse cx="-12" cy="7"   rx="7" ry="12" fill="#F9E04B" transform="rotate(-120,-12,7)"/>
      <ellipse cx="-12" cy="-7"  rx="7" ry="12" fill="#FFD700" transform="rotate(-60,-12,-7)"/>
      <circle cx="0" cy="0" r="7" fill="#C8A800"/>
    </g>
    <g transform="translate(475,555)" opacity="0.75">
      <ellipse cx="0"   cy="-14" rx="7" ry="12" fill="#F4BFBF"/>
      <ellipse cx="12"  cy="-7"  rx="7" ry="12" fill="#FDE8E8" transform="rotate(60,12,-7)"/>
      <ellipse cx="12"  cy="7"   rx="7" ry="12" fill="#F4BFBF" transform="rotate(120,12,7)"/>
      <ellipse cx="0"   cy="14"  rx="7" ry="12" fill="#EAA8A8"/>
      <ellipse cx="-12" cy="7"   rx="7" ry="12" fill="#F4BFBF" transform="rotate(-120,-12,7)"/>
      <ellipse cx="-12" cy="-7"  rx="7" ry="12" fill="#FDE8E8" transform="rotate(-60,-12,-7)"/>
      <circle cx="0" cy="0" r="7" fill="#D98E8E"/>
    </g>

    <!-- Tiny leaf sprigs on label -->
    <ellipse cx="350" cy="505" rx="8" ry="16" fill="#8BC08A" transform="rotate(-40,350,505)" opacity="0.55"/>
    <ellipse cx="340" cy="520" rx="7" ry="14" fill="#6A9E68" transform="rotate(-60,340,520)" opacity="0.45"/>
    <ellipse cx="450" cy="505" rx="8" ry="16" fill="#8BC08A" transform="rotate(40,450,505)" opacity="0.55"/>
    <ellipse cx="460" cy="520" rx="7" ry="14" fill="#6A9E68" transform="rotate(60,460,520)" opacity="0.45"/>

    <!-- Snowflake / cool icon on label -->
    <g transform="translate(400,607)" opacity="0.55">
      <line x1="0" y1="-13" x2="0" y2="13"   stroke="#A0D8EF" stroke-width="1.8"/>
      <line x1="-13" y1="0" x2="13" y2="0"   stroke="#A0D8EF" stroke-width="1.8"/>
      <line x1="-9" y1="-9" x2="9" y2="9"    stroke="#A0D8EF" stroke-width="1.4"/>
      <line x1="-9" y1="9"  x2="9" y2="-9"   stroke="#A0D8EF" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="3.5" fill="#C8EDFF"/>
    </g>

    <!-- Volume text at bottom of label -->
    <text x="400" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" letter-spacing="2" fill="#9a6060">50 ml · FRANCE</text>

    <!-- ── Bottle base ── -->
    <rect x="280" y="726" width="240" height="24" rx="8" fill="#C87878" opacity="0.5"/>
    <rect x="283" y="726" width="234" height="8" rx="4" fill="rgba(255,200,200,0.4)"/>
  </g>

  <!-- ══ Floating flower elements in front ══ -->
  <!-- Jasmine sprigs top-left of bottle -->
  <g opacity="0.80">
    <line x1="255" y1="430" x2="215" y2="390" stroke="#8BC08A" stroke-width="2"/>
    <line x1="215" y1="390" x2="185" y2="365" stroke="#8BC08A" stroke-width="1.5"/>
    <circle cx="185" cy="360" r="9" fill="white" stroke="#DDEEDD" stroke-width="1"/>
    <circle cx="185" cy="360" r="4" fill="#F9E04B"/>
    <circle cx="200" cy="348" r="8" fill="white" stroke="#DDEEDD" stroke-width="1"/>
    <circle cx="200" cy="348" r="4" fill="#F9E04B"/>
    <circle cx="170" cy="348" r="7" fill="white" stroke="#DDEEDD" stroke-width="1"/>
    <circle cx="170" cy="348" r="3.5" fill="#F9E04B"/>
    <circle cx="195" cy="370" r="7" fill="white" stroke="#DDEEDD" stroke-width="1"/>
    <circle cx="195" cy="370" r="3.5" fill="#F9E04B"/>
    <!-- leaves -->
    <ellipse cx="230" cy="414" rx="12" ry="6" fill="#6A9E68" transform="rotate(-30,230,414)" opacity="0.7"/>
    <ellipse cx="244" cy="400" rx="10" ry="5" fill="#8BC08A" transform="rotate(-50,244,400)" opacity="0.6"/>
  </g>

  <!-- Rose bud right side -->
  <g opacity="0.85" transform="translate(540,460)">
    <ellipse cx="0" cy="0" rx="18" ry="28" fill="#EAA0A0"/>
    <ellipse cx="-8" cy="5" rx="16" ry="22" fill="#F4BFBF"/>
    <ellipse cx="8"  cy="5" rx="15" ry="20" fill="#F9D0D0"/>
    <ellipse cx="0"  cy="8" rx="10" ry="14" fill="#FDE8E8"/>
    <ellipse cx="0"  cy="10" rx="5" ry="8"  fill="#F4BFBF"/>
    <!-- stem -->
    <line x1="0" y1="28" x2="0" y2="65" stroke="#6A9E68" stroke-width="2"/>
    <ellipse cx="-12" cy="50" rx="14" ry="7" fill="#8BC08A" transform="rotate(-35,-12,50)" opacity="0.75"/>
    <ellipse cx="14"  cy="58" rx="12" ry="6" fill="#6A9E68" transform="rotate(30,14,58)" opacity="0.65"/>
  </g>

  <!-- ══ Gold dots / sparkles ══ -->
  <circle cx="310" cy="285" r="3.5" fill="#FFD700" opacity="0.8" filter="url(#glow)"/>
  <circle cx="495" cy="295" r="3"   fill="#FFD700" opacity="0.7" filter="url(#glow)"/>
  <circle cx="268" cy="560" r="2.5" fill="#F9E04B" opacity="0.65"/>
  <circle cx="535" cy="540" r="2.5" fill="#F9E04B" opacity="0.65"/>
  <circle cx="390" cy="290" r="2"   fill="#FFD700" opacity="0.6"/>
  <circle cx="415" cy="282" r="1.5" fill="#FFD700" opacity="0.5"/>

  <!-- ══ Brand watermark bottom ══ -->
  <text x="400" y="854" text-anchor="middle" font-family="Georgia,serif" font-size="13"
        letter-spacing="8" fill="rgba(140,70,70,0.45)">BLÜTENFRISCH · PARIS</text>
  <line x1="260" y1="862" x2="540" y2="862" stroke="rgba(200,100,100,0.25)" stroke-width="0.8"/>
</svg>
